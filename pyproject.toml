[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pwr-surrogate"
version = "0.1.0"
description = "ML surrogate for 2-D PWR core neutronics"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "h5py",
    "pyyaml",
    "scipy",
    "ndiffusion",
]

[project.optional-dependencies]
model = ["torch", "nvidia-physicsnemo>=2.2"]
benchmark = ["scikit-learn", "matplotlib", "joblib"]
backend = ["fastapi", "uvicorn[standard]", "pydantic>=2"]
agent = ["anthropic>=2.3"]
dev = ["pytest", "ruff"]
# OpenMC is not on PyPI; install via conda (see environment.yml).

[tool.setuptools.packages.find]
include = ["datagen*", "model*", "backend*", "agent*"]

[tool.setuptools.package-data]
datagen = ["library/nrc_mox_helios/*", "configs/*"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
